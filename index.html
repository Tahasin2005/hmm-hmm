    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KLORIX",
        "alternateName": "KLORIX Community",
        "url": "https://klorixcommunity.vercel.app/",
        "description": "KLORIX — Connect. Share. Belong. A modern social network built for real-time conversations, community posts, embedded videos, and meaningful connections.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "image": "https://klorixcommunity.vercel.app/assets/images/og-banner.png"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hmm_theme");
          if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
          var rawCfg = localStorage.getItem("hmm_site_config_cache");
          if (rawCfg) {
            var cfg = JSON.parse(rawCfg);
            if (cfg.faviconUrl) {
              var fav = document.getElementById("dynamic-favicon");
              if (fav) { fav.href = cfg.faviconUrl; fav.removeAttribute("type"); }
            }
            if (cfg.siteName) {
              document.title = cfg.siteName + (cfg.tagline ? " — " + cfg.tagline : "");
            }
            if (cfg.metaDescription) {
              var md = document.querySelector('meta[name="description"]');
              if (md) md.setAttribute("content", cfg.metaDescription);
            }
            if (cfg.metaKeywords) {
              var mk = document.querySelector('meta[name="keywords"]');
              if (mk) mk.setAttribute("content", cfg.metaKeywords);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app-root">
      <div class="loading-screen">
        <img src="assets/icons/logo.svg" alt="KLORIX" data-site-logo style="width:48px;height:48px;border-radius:12px;object-fit:cover;" />
        <div class="spinner"></div>
        <p class="text-muted" style="font-size:14px;">Loading <span data-site-name>KLORIX</span>...</p>
      </div>
    </div>
