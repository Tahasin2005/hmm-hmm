<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HMM HMM — Connect. Share. Belong.</title>
    <meta name="description" content="HMM HMM — Connect. Share. Belong. A modern Bangladeshi social network built for real-time conversations, community posts, and meaningful connections." />
    <meta property="og:title" content="HMM HMM — Connect. Share. Belong." />
    <meta property="og:description" content="A modern Bangladeshi social network built for real-time conversations, community posts, and meaningful connections." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/images/og-banner.svg" />
    <meta name="theme-color" content="#006A4E" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hmm_theme");
          if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app-root">
      <div class="loading-screen">
        <img src="assets/icons/logo.svg" alt="HMM HMM" style="width:48px;height:48px;border-radius:12px;" />
        <div class="spinner"></div>
        <p class="text-muted" style="font-size:14px;">Loading HMM HMM...</p>
      </div>
    </div>

    <!-- Official Firebase Web SDK v11.6.1 Compat CDN (works directly on local file:// and cPanel HTTPS) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>

    <!-- HMM HMM Application Scripts (classic order, zero CORS issues on file://) -->
    <script src="js/firebase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/friends.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
